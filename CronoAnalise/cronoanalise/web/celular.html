<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2632">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cronoanálise Prado — Celular</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/celular.css">
</head>
<body class="campo">

<div class="campo-topo">
  <div class="logo">P</div>
  <select id="sel-estudo" onchange="Campo.trocarEstudo()"></select>
  <span class="sinal" id="sinal">—</span>
</div>

<div id="avisos"></div>

<div class="campo-palco" id="palco">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="desenho"></canvas>
  <div class="placa" id="placa">Toque em <b>Ligar câmera</b> para começar</div>
  <div class="painel" id="painel" hidden>
    <div class="bloco">
      <div class="rot">Tempo</div>
      <div class="tempo" id="hud-tempo">00:00</div>
    </div>
    <div class="bloco nums">
      <div class="rot">Ciclos</div>
      <b id="hud-ciclos">0</b>
      <div class="rot" id="hud-ultimo">último —</div>
    </div>
  </div>
  <div class="gravando" id="gravando" hidden><i></i> GRAVANDO</div>
</div>

<div class="ferramentas">
  <button id="bt-camera" onclick="Campo.ligarCamera()">Ligar câmera</button>
  <button onclick="Campo.virarCamera()">Virar</button>
  <button id="bt-lanterna" onclick="Campo.lanterna()" hidden>Lanterna</button>
  <button id="bt-roi" onclick="Campo.alternarDesenho()">Marcar região</button>
  <input type="range" id="zoom" min="1" max="5" step="0.1" value="1"
         oninput="Campo.zoom(this.value)" hidden>
</div>

<div class="abas">
  <button id="aba-vivo" class="ativo" onclick="Campo.modo('vivo')">Ao vivo</button>
  <button id="aba-gravar" onclick="Campo.modo('gravar')">Gravar e analisar</button>
  <button id="aba-manual" onclick="Campo.modo('manual')">Só cronômetro</button>
</div>

<div class="acao">
  <button class="iniciar" id="bt-acao" onclick="Campo.alternar()">Iniciar</button>
</div>

<div id="painel-manual" hidden>
  <div class="elementos" id="botoes-elementos"></div>
  <div class="ciclo-btn"><button onclick="Campo.fimDeCiclo()">Fim de ciclo</button></div>
</div>

<div id="painel-envio" hidden>
  <div class="campo-aviso" id="texto-envio"></div>
</div>

<div class="campo-log" id="log"></div>
<div class="campo-resultado" id="resultado"></div>

<footer style="color:var(--beige);opacity:.6">
  Grupo Prado · Safety Prado · Country Prado · 2026 ·
  <a href="/" style="color:var(--yellow)">tela completa</a>
</footer>

<script src="/static/comum.js"></script>
<script src="/static/celular.js"></script>
</body>
</html>
