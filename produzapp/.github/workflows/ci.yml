name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: produzapp, POSTGRES_PASSWORD: dev, POSTGRES_DB: produzapp_teste }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U produzapp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://produzapp:dev@localhost:5432/produzapp_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
